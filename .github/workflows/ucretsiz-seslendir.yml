name: Ücretsiz Seslendirme (Chatterbox)

permissions:
  contents: write

# sesler/istek/ klasörüne bir .txt (her satır bir cümle) eklenince Levent'in ücretsiz klon sesiyle okur,
# sonuçları sesler/cikti/<ad>/ altına kaydeder. Kredi harcamaz.
on:
  workflow_dispatch:
  push:
    paths:
      - "sesler/istek/**"

concurrency:
  group: ucretsiz-seslendir
  cancel-in-progress: false

jobs:
  seslendir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q chatterbox-tts
      - run: python ucretsiz_seslendir.py
      - name: Sesleri kaydet
        if: always()
        run: |
          git config user.name "dukkan-tv-bot"; git config user.email "actions@users.noreply.github.com"
          rm -f sesler/_ref.wav sesler/cikti/*/_*.wav
          git add sesler/cikti; git diff --cached --quiet || (git commit -qm "Ücretsiz seslendirme" && (git push origin HEAD:${{ github.ref_name }} || (git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }})))
