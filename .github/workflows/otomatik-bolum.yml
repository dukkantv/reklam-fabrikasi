name: Otomatik Bölüm

# Levent'in Maceraları — tam otomatik, dudak senkronlu bölüm üretimi
# (fal.ai: Nano Banana Pro + Kling AI Avatar + Seedance · Gemini senaryo/kontrol · ElevenLabs sesler)
# Sıra: karakter (bir kez) -> ses (bir kez) -> taslak -> video. 'hepsi' = taslak + video onaysız.
# "hepsi" seçilirse onay beklemeden taslak + video birlikte yapılır.

on:
  workflow_dispatch:
    inputs:
      asama:
        description: "Ne yapılsın?"
        required: true
        type: choice
        default: taslak
        options:
          - taslak
          - video
          - klip
          - hepsi
          - karakter
          - karakter-yenile
          - ses
      klasor:
        description: "Esnaf klasörü (reklamlar/ içindeki, örn: eserim)"
        required: true
        default: "eserim"
      konu:
        description: "Bölümün konusu (boş bırakırsan yapay zekâ seçer)"
        required: false
        default: ""
      yeniden:
        description: "Taslakta: yeniden çizilecek planlar (örn 3,7) · Klipte: üretilecek planlar · Seste: değişecek roller"
        required: false
        default: ""
      kalite:
        description: "Video kalitesi"
        required: true
        type: choice
        default: "standart"
        options:
          - standart
          - pro

permissions:
  contents: write

concurrency:
  group: otomatik-bolum-${{ github.event.inputs.klasor }}

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAL_KEY: ${{ secrets.FAL_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      KALITE: ${{ github.event.inputs.kalite }}
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araçları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y fonts-inter fonts-noto-color-emoji || echo "Yazı tipi kurulamadı, yedek kullanılacak"
          pip install edge-tts requests numpy
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Karakterler
        if: startsWith(github.event.inputs.asama, 'karakter')
        run: python oto_bolum.py karakter ${{ github.event.inputs.asama == 'karakter-yenile' && 'yenile' || '' }}

      - name: Sesler
        if: github.event.inputs.asama == 'ses'
        env:
          YENIDEN: ${{ github.event.inputs.yeniden }}
        run: python oto_bolum.py ses "$YENIDEN"

      - name: Taslak (senaryo + plan resimleri + yüz kontrolü)
        if: github.event.inputs.asama == 'taslak' || github.event.inputs.asama == 'hepsi'
        env:
          KONU: ${{ github.event.inputs.konu }}
          YENIDEN: ${{ github.event.inputs.yeniden }}
        run: python oto_bolum.py taslak "${{ github.event.inputs.klasor }}" "$KONU" "$YENIDEN"

      - name: Resimleri depoya kaydet
        if: always()
        run: |
          git config user.name "dukkan-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add karakterler reklamlar harcama
          git diff --cached --quiet || (git commit -m "Otomatik bölüm: ${{ github.event.inputs.asama }} / ${{ github.event.inputs.klasor }}" && (git push || (git pull --rebase origin main && git push)))

      - name: Sadece seçili planların klipleri (montajsız, düzeltme için)
        if: github.event.inputs.asama == 'klip'
        env:
          YENIDEN: ${{ github.event.inputs.yeniden }}
        run: python oto_bolum.py klip "${{ github.event.inputs.klasor }}" "$YENIDEN"

      - name: Video (hareketlendir + seslendir + birleştir)
        if: github.event.inputs.asama == 'video' || github.event.inputs.asama == 'hepsi'
        run: python oto_bolum.py video "${{ github.event.inputs.klasor }}"

      - name: Klipleri depoya kaydet (tekrar ödeme olmasın)
        if: always() && (github.event.inputs.asama == 'video' || github.event.inputs.asama == 'hepsi' || github.event.inputs.asama == 'klip')
        run: |
          git config user.name "dukkan-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reklamlar harcama
          git diff --cached --quiet || (git commit -m "Otomatik bölüm klipleri: ${{ github.event.inputs.klasor }}" && (git push || (git pull --rebase origin main && git push)))

      - name: Videoyu indirilebilir olarak sakla
        if: github.event.inputs.asama == 'video' || github.event.inputs.asama == 'hepsi'
        uses: actions/upload-artifact@v4
        with:
          name: otomatik-bolum-${{ github.event.inputs.klasor }}
          path: cikti/Levent_*.mp4
          retention-days: 3

      - name: Yayın kuyruğuna ekle (Telegram'da onay butonu gelir)
        if: success() && (github.event.inputs.asama == 'video' || github.event.inputs.asama == 'hepsi') && hashFiles('cikti/yayin.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          y = json.load(open("cikti/yayin.json", encoding="utf-8"))
          subprocess.run(["python3", "yt_kuyruk.py", "ekle", "dukkantv", y["video"], y["baslik"], y["aciklama"], y["etiketler"]], check=True)
          PY
          git config user.name "dukkan-tv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kuyruk
          git diff --cached --quiet || (git commit -m "Yayın kuyruğu: yeni bölüm" && (git push || (git pull --rebase origin main && git push)))

