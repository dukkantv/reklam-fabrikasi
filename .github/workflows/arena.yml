name: 81 İl Turnuvası

permissions:
  contents: write

# Sıradaki maçı oynatır (tamamen kodla, ücretsiz), sezon tablosunu günceller, videoyu Telegram'a yollar.
# Kanallar açılınca: günlük zamanlama + yayın kuyruğu eklenecek.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy pillow requests
      - name: Maçı oynat
        working-directory: arena
        run: python turnuva.py oyna
      - name: Sezon tablosunu kaydet
        run: |
          git config user.name "dukkan-tv-bot"; git config user.email "actions@users.noreply.github.com"
          git add arena/sezon.json; git diff --cached --quiet || (git commit -qm "81 İl Turnuvası: maç oynandı" && (git push || (git pull --rebase origin main && git push)))
