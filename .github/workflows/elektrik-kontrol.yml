name: Elektriksiz Dünya - Ses kontrolü

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["elektrik/kontrol.py"]

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q faster-whisper
      - run: python elektrik/kontrol.py
      - name: Kaydet
        run: |
          git config user.name "Dükkan TV Bot"; git config user.email "dukkan.tvstudio@gmail.com"
          git add elektrik/ses/dokum.json; git diff --cached --quiet || (git commit -qm "Elektriksiz Dünya ses kontrolü" && (git push || (git pull --rebase origin main && git push)))
