name: Elle Paylaş (Instagram / TikTok)

# Kuyruktan kaçmış bir videoyu Instagram'a Reels olarak paylaşır.
# Video, onu üreten çalışmanın (ör. Otomatik Bölüm) Artifacts kısmından alınır.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Nereye"
        type: choice
        default: instagram
        options: [instagram, tiktok]
      kanal:
        description: "Hesap"
        type: choice
        options: [dukkantv, kasakurgu, dramabite]
      run_id:
        description: "Videoyu üreten çalışmanın numarası (Actions adresindeki sayı)"
        required: true
      aciklama:
        description: "Açıklama (TikTok'ta Telegram'a gelir, sen yapıştırırsın)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  paylas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/video
      - name: Reels olarak paylaş
        env:
          KANAL: ${{ inputs.kanal }}
          ACIKLAMA: ${{ inputs.aciklama }}
          PLATFORM: ${{ inputs.platform }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import glob, os
          from ig_ortak import reels_yukle
          from yt_ortak import telegram
          dosyalar = sorted(glob.glob("/tmp/video/**/*.mp4", recursive=True))
          if not dosyalar:
              raise SystemExit("Çalışmada mp4 bulunamadı")
          kanal = os.environ["KANAL"]
          if os.environ.get("PLATFORM") == "tiktok":
              from tt_ortak import taslak_yukle
              pid = taslak_yukle(kanal, dosyalar[-1])
              print("TikTok taslak:", pid)
              telegram(f"🎵 {kanal}: video TikTok'a taslak olarak gönderildi. TikTok'ta bildirimi aç → "
                       f"açıklamayı yapıştır → Paylaş.\n\nAçıklama (kopyala):\n{os.environ['ACIKLAMA']}")
          else:
              mid, link = reels_yukle(kanal, dosyalar[-1], os.environ["ACIKLAMA"])
              print("Paylaşıldı:", link)
              telegram(f"📸 {kanal}: video Instagram'da Reels olarak paylaşıldı (elle).\n{link}")
          EOF
      - name: TikTok anahtarını kaydet
        if: inputs.platform == 'tiktok'
        run: |
          git config user.name "Dükkan TV Bot"
          git config user.email "dukkan.tvstudio@gmail.com"
          git add tokens/
          git diff --cached --quiet && exit 0
          git commit -m "TikTok anahtarı yenilendi"
          git pull --rebase -q && git push
