name: Ücretsiz Ses Klonu (deneme)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ornek:
        description: "Sadece bu örnek(ler) (örn. rakam). Boş = hepsi + belgesel testi"
        default: ""

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Kurulum (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts requests edge-tts numpy
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1
      - run: python ucretsiz_ses.py deneme ${{ inputs.ornek }}
      - name: Kulak kontrolü (sesi yazıya döküp ne okunduğunu gösterir)
        if: ${{ inputs.ornek != '' }}
        run: |
          pip install -q faster-whisper
          python - <<'PY'
          import glob
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("/tmp/klon/*.wav")):
              s, _ = m.transcribe(f, language="tr")
              print("DUYULAN", f, "::", " ".join(x.text.strip() for x in s))
          PY
      - name: Belgesel geçiş testi (ElevenLabs yokken ücretsiz klona düşüyor mu?)
        if: ${{ inputs.ornek == '' }}
        env:
          BELGESEL_SES_MOTOR: klon
          ELEVENLABS_API_KEY: ""
        run: |
          mkdir -p cikti/belgesel
          python - <<'PY'
          import os, subprocess, belgesel
          sahneler = [{"metin": "Mayıs 1481. Dünyanın en korkulan hükümdarı sefere çıkıyor."},
                      {"metin": "Hedefini kimse bilmiyor. Ve birkaç gün sonra, bir çadırda, sessizce ölüyor."}]
          motor = belgesel.sesleri_hazirla(sahneler)
          assert motor == "ucretsiz", motor
          for i in (1, 2):
              y = os.path.join(belgesel.CIKTI, f"s_{i:03d}.mp3")
              d = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", y],
                                       capture_output=True, text=True).stdout)
              assert d > 2, (y, d)
              print(y, f"{d:.1f} sn")
          PY
          cp cikti/belgesel/s_001.mp3 /tmp/klon/klon-belgesel-gecis.mp3
      - name: Örnekleri kaydet
        run: |
          cd /tmp/klon && for f in *.wav; do ffmpeg -v error -y -i $f -b:a 128k "klon-${f%.wav}.mp3"; done
          gh release upload kuyruk /tmp/klon/klon-*.mp3 --clobber -R ${{ github.repository }}
