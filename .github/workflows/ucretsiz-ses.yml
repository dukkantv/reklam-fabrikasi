name: Ücretsiz Ses Klonu (deneme)

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Kurulum (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts requests
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1
      - run: python ucretsiz_ses.py deneme
      - name: Örnekleri kaydet
        run: |
          cd /tmp/klon && for f in *.wav; do ffmpeg -v error -y -i $f -b:a 128k "klon-${f%.wav}.mp3"; done
          gh release upload kuyruk /tmp/klon/klon-*.mp3 --clobber -R ${{ github.repository }}
