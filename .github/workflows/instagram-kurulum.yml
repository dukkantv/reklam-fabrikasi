name: Instagram Kurulum

# IG_USER_TOKEN gizli anahtarındaki (60 günlük) kullanıcı anahtarıyla, Facebook sayfalarına bağlı
# Instagram hesaplarının SÜRESİZ sayfa anahtarlarını alır ve şifreli olarak tokens/ klasörüne kaydeder.
on:
  push:
    branches: [main]
    paths: ["tokens/ig_kurulum_iste.txt"]   # Claude bu dosyayı değiştirerek kurulumu başlatabilir
  workflow_dispatch:
    inputs:
      video:
        description: "Teşhis için kuyruk sürümündeki video adı (isteğe bağlı)"
        required: false
        default: ""
      teshis:
        description: "Sadece teşhis (kanal adı, örn. dramabite). Boşsa kurulum yapılır."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  kurulum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sayfa anahtarlarını al
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_TOKEN: ${{ secrets.IG_USER_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.teshis }}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
            if [ -n "${{ inputs.video }}" ]; then
              gh release download kuyruk -p "${{ inputs.video }}" -D /tmp
              python3 ig_ortak.py teshis_video ${{ inputs.teshis }} /tmp/${{ inputs.video }}
              exit 0
            fi
            for k in ${{ inputs.teshis }}; do echo "===== $k"; python3 ig_ortak.py teshis $k; done
          else
            python3 ig_ortak.py kurulum
          fi
      - name: Kaydet
        run: |
          git config user.name "Dükkan TV Bot"
          git config user.email "dukkan.tvstudio@gmail.com"
          git add tokens/
          git diff --cached --quiet && exit 0
          git commit -m "Instagram bağlantısı"
          git pull --rebase -q && git push
