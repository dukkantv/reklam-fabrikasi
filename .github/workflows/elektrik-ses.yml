name: Elektriksiz Dünya - Seslendirme

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["elektrik/metin.json"]

jobs:
  seslendir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Kurulum (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts requests
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-v1
      - run: python elektrik/seslendir.py
      - name: Kontrol (yazıya dökme)
        run: pip install -q faster-whisper && python elektrik/kontrol.py
      - name: Sesleri kaydet
        run: |
          git config user.name "Dükkan TV Bot"; git config user.email "dukkan.tvstudio@gmail.com"
          git add elektrik/ses; git diff --cached --quiet || (git commit -qm "Elektriksiz Dünya seslendirme" && (git push || (git pull --rebase -X theirs origin main && git push)))
