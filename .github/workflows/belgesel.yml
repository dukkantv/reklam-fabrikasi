name: Uzun Video (Belgesel)

permissions:
  contents: write

# "Eskiden Bursa'da Esnaf Olmak" — ücretsiz araçlarla çizgi roman tarzı uzun video. Yayınlamaz, Telegram'a gönderir.
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Bölüm konusu"
        default: "1990'da Bursa'da kendi bakkalını açsaydın?"
      dakika:
        description: "Yaklaşık süre (dakika)"
        default: "10"
      tur:
        description: "Tür: tarih / dedektif / hikaye"
        default: "tarih"
      kanal:
        description: "Yayın kanalı (boş = sadece Telegram'a pilot): gizlitarih / kasakurgu / dramabite"
        default: ""
      senaryo:
        description: "Hazır senaryo dosyası (ör. senaryolar/kanuni.json) — boşsa Gemini yazar"
        default: ""
      ses:
        description: "Anlatım sesi: klon (Levent, ElevenLabs v3 — kredi yetmezse otomatik Ahmet) / ahmet"
        default: "klon"

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      SENARYO_DOSYA: ${{ inputs.senaryo }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      BELGESEL_SES_MOTOR: ${{ inputs.ses }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core >/dev/null
          pip install -q edge-tts requests numpy
      - name: Üret
        run: python belgesel.py "${{ inputs.konu }}" "${{ inputs.dakika }}" "${{ inputs.tur }}"
      - name: Yayın kuyruğuna ekle
        if: inputs.kanal != ''
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KANAL: ${{ inputs.kanal }}
          TUR: ${{ inputs.tur }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          y = json.load(open("cikti/belgesel/yayin.json", encoding="utf-8"))
          kat = {"tarih": "27", "dedektif": "24", "hikaye": "24"}[os.environ["TUR"]]
          subprocess.run(["python3", "yt_kuyruk.py", "ekle", os.environ["KANAL"], y["video"], y["baslik"], y["aciklama"],
                          ",".join(y.get("etiketler", [])), "", y["kapak"], kat], check=True)
          PY
          git config user.name "dukkan-tv-bot"; git config user.email "actions@users.noreply.github.com"
          git add kuyruk; git commit -qm "Uzun video kuyruğa: $KANAL" && (git push || (git pull --rebase origin main && git push))
      - name: Sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belgesel
          path: |
            cikti/belgesel/*.mp4
            cikti/belgesel/senaryo.json
            cikti/belgesel/kapak.jpg
            cikti/belgesel/yayin.json
          retention-days: 14
      - name: Resim ve senaryoyu depoya kaydet (inceleme için)
        if: always()
        run: |
          D=belgesel_deneme/${{ inputs.tur }}; rm -rf $D; mkdir -p $D
          cp cikti/belgesel/senaryo.json cikti/belgesel/yayin.json cikti/belgesel/kapak.jpg $D/ 2>/dev/null || true
          for f in cikti/belgesel/k_*.jpg; do [ -f "$f" ] && ffmpeg -v error -y -i "$f" -vf scale=480:-2 -q:v 6 "$D/$(basename $f)"; done
          git config user.name "dukkan-tv-bot"; git config user.email "actions@users.noreply.github.com"
          git add belgesel_deneme; git diff --cached --quiet || (git commit -qm "Belgesel deneme: resimler" && (git push || (git pull --rebase origin main && git push)))
