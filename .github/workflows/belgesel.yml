name: Belgesel Deneme

# "Eskiden Bursa'da Esnaf Olmak" — ücretsiz araçlarla çizgi roman tarzı uzun video. Yayınlamaz, Telegram'a gönderir.
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Bölüm konusu"
        default: "1990'da Bursa'da kendi bakkalını açsaydın?"
      dakika:
        description: "Yaklaşık süre (dakika)"
        default: "5"

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null
          pip install -q edge-tts requests numpy
      - name: Üret
        run: python belgesel.py "${{ inputs.konu }}" "${{ inputs.dakika }}"
      - name: Sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belgesel
          path: |
            cikti/belgesel/*.mp4
            cikti/belgesel/senaryo.json
            cikti/belgesel/r_*.jpg
          retention-days: 14
      - name: Resim ve senaryoyu depoya kaydet (inceleme için)
        if: always()
        run: |
          mkdir -p belgesel_deneme && cp cikti/belgesel/senaryo.json cikti/belgesel/r_*.jpg belgesel_deneme/ 2>/dev/null || true
          git config user.name "dukkan-tv-bot"; git config user.email "actions@users.noreply.github.com"
          git add belgesel_deneme; git diff --cached --quiet || (git commit -qm "Belgesel deneme: resimler" && (git push || (git pull --rebase origin main && git push)))
