name: Çizimleri Hazırla (sessiz)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      senaryo:
        description: "Senaryo dosyası (ör. senaryolar/kilitli-oda-kuyumcu.json)"
      tur:
        description: "dedektif / hikaye / tarih"
        default: "dedektif"
      yeniden:
        description: "Yeniden çizilecek sahne numaraları (ör. 5,7,12) — boşsa sadece eksikler"
        default: ""

jobs:
  ciz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q requests pillow
      - run: python3 cizim_hazirla.py "${{ inputs.senaryo }}" "${{ inputs.tur }}" "${{ inputs.yeniden }}"
      - name: Kaydet
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add gorseller
          git commit -qm "Çizimler hazırlandı: ${{ inputs.senaryo }}" || exit 0
          git push || (git pull --rebase origin main && git push)
