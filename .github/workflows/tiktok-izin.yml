name: TikTok İzin

# 1) Kod boş bırakılırsa: TikTok izin bağlantısı Telegram'a gelir.
# 2) Bağlantıda izin verince açılan sayfadaki kodu buraya yapıştır: bağlantı kurulur.
on:
  push:
    branches: [main]
    paths: ["tokens/tt_izin_iste.txt"]   # Claude: dosyaya kanal adını yazınca izin bağlantısı Telegram'a gider
  workflow_dispatch:
    inputs:
      kanal:
        description: "Hangi kanalın TikTok hesabı"
        type: choice
        default: dukkantv
        options: [dukkantv, kasakurgu, dramabite, ilturnuva, gizlitarih]
      kod:
        description: "İzin sayfasındaki kod (ilk seferde boş bırak)"
        required: false
      durum:
        description: "(Teknik) gönderim numarasının durumunu sorgula"
        required: false

permissions:
  contents: write

jobs:
  izin:
    runs-on: ubuntu-latest
    env:
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KANAL: ${{ inputs.kanal }}
      KOD: ${{ inputs.kod }}
      DURUM: ${{ inputs.durum }}
    steps:
      - uses: actions/checkout@v4
      - name: İzin bağlantısı ya da kurulum
        run: |
          if [ -z "$KANAL" ]; then KANAL=$(tr -d '[:space:]' < tokens/tt_izin_iste.txt); fi
          if [ -n "$DURUM" ]; then python3 tt_ortak.py durum "$KANAL" "$DURUM"
          elif [ -z "$KOD" ]; then python3 tt_ortak.py link "$KANAL"
          else python3 tt_ortak.py kurulum "$KANAL" "$KOD"; fi
      - name: Kaydet
        run: |
          git config user.name "Dükkan TV Bot"
          git config user.email "dukkan.tvstudio@gmail.com"
          git add tokens/
          git diff --cached --quiet && exit 0
          git commit -m "TikTok bağlantısı"
          git pull --rebase -q && git push
