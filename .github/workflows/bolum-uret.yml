name: Bölüm Üret

# Önce çizgi film kliplerini SIRAYLA Dükkan TV Telegram botuna gönder, sonra bunu çalıştır.

on:
  workflow_dispatch:
    inputs:
      klasor:
        description: "Esnaf klasörü (reklamlar/ içindeki, örn: eserim)"
        required: true
        default: "eserim"

jobs:
  bolum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araçları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y fonts-inter fonts-noto-color-emoji || echo "Yazı tipi kurulamadı, yedek kullanılacak"
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Klipleri topla ve bölümü birleştir
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bolum.py "${{ github.event.inputs.klasor }}"

      - name: Videoyu indirilebilir olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: bolum-${{ github.event.inputs.klasor }}
          path: cikti/*.mp4
          retention-days: 30

      - name: Telegram'a gönder
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for f in cikti/*.mp4; do
            case "$f" in *_yaziliyor.mp4|*parca_*|*bilgi_*|cikti/klipler/*) continue;; esac
            curl -sS -F chat_id="$CHAT" -F video=@"$f" -F supports_streaming=true \
              -F caption="🎬 Dükkan TV bölüm hazır: $(basename "$f")" \
              "https://api.telegram.org/bot$TOKEN/sendVideo" | head -c 300
          done
