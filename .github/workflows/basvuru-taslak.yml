name: Başvuru Taslak

# Siteden gelen başvuruyu (form + fotoğraflar) okur, Gemini ile reklam taslağını yazar,
# reklamlar/<klasör>/ altına kaydeder ve Levent'e Telegram'dan onay butonlarıyla gönderir.
# Normalde "YouTube Yayın" işi yeni başvuru görünce bunu kendisi başlatır.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Başvuru numarası (örn. 20261111-142635-js7r)"
        required: true

permissions:
  contents: write

concurrency:
  group: basvuru-taslak-${{ inputs.id }}

jobs:
  taslak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ONAY_URL: https://dukkantv-onay.dukkan-tvstudio.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Taslağı hazırla
        run: python3 basvuru.py taslak "${{ inputs.id }}"
      - name: Klasörü kaydet
        if: always()
        run: |
          git config user.name "Dükkan TV Bot"
          git config user.email "dukkan.tvstudio@gmail.com"
          git add -A reklamlar
          git diff --cached --quiet && exit 0
          git commit -m "Başvuru taslağı: ${{ inputs.id }}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Hata olursa haber ver
        if: failure()
        run: |
          curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ Başvuru ${{ inputs.id }} için taslak hazırlanamadı. Bir sonraki kontrolde tekrar denenecek. Ayrıntı: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
