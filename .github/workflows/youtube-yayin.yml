name: YouTube Yayın

# Onay bekleyen videoları kontrol eder; Levent'in Telegram'da "Onayla" dediklerini
# YouTube'a 19:00'a planlı yükler. Ayrıca elle video eklemek için de kullanılır.
on:
  schedule:
    - cron: "13 6-14 * * *"    # 09:13–17:13 her saat (onaylar)
    - cron: "3,33 15 * * *"    # 18:03, 18:33
    - cron: "1,11,21,31,41,51 16-18 * * *" # 19:01–21:51 on dakikada bir (GitHub bazı tetiklemeleri atlıyor; biri kaçarsa sonraki yetişir)
    - cron: "7,37 19 * * *"    # 22:07, 22:37 son kontrol
  workflow_dispatch:
    inputs:
      kanal:
        description: "Elle ekleme: kanal (boş = sadece onayları kontrol et)"
        required: false
        type: choice
        default: ""
        options: ["", dukkantv, kasakurgu, dramabite, gizlitarih, ilturnuva]
      video_url:
        description: "Elle ekleme: videonun indirme adresi (mp4)"
        required: false
      baslik:
        description: "Elle ekleme: başlık"
        required: false
      aciklama:
        description: "Elle ekleme: açıklama"
        required: false
      etiketler:
        description: "Elle ekleme: etiketler (virgülle)"
        required: false
      stok:
        description: "Elle ekleme: günlük mizah stoğu olarak gönder (Telegram'dan onaylanınca stoğa girer)"
        type: boolean
        default: false
      planla:
        description: "Planlı videoların saatlerini aralıklı olacak şekilde yeniden dağıt"
        type: boolean
        default: false
      urunler:
        description: "Yüklenmiş planlı videoların açıklamasına ürün linklerini ekle"
        type: boolean
        default: false
      geri_al:
        description: "Arşivden geri alınacak kayıt id'si (Telegram'daki videodan indirilir)"
        required: false
      urun_kaldir:
        description: "Bütün kanallardaki bütün videoların açıklamasından satış linklerini sil"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-yayin

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ONAY_URL: https://dukkantv-onay.dukkan-tvstudio.workers.dev   # Cloudflare onay dinleyicisi
    steps:
      - uses: actions/checkout@v4
      - name: Elle ekle
        if: inputs.kanal != '' && inputs.video_url != ''
        env:
          KANAL: ${{ inputs.kanal }}
          URL: ${{ inputs.video_url }}
          BASLIK: ${{ inputs.baslik }}
          ACIKLAMA: ${{ inputs.aciklama }}
          ETIKETLER: ${{ inputs.etiketler }}
          GUNLUK: ${{ inputs.stok && '1' || '' }}
        run: |
          curl -fsSL "$URL" -o /tmp/elle.mp4
          python3 yt_kuyruk.py ekle "$KANAL" /tmp/elle.mp4 "$BASLIK" "$ACIKLAMA" "$ETIKETLER" "$GUNLUK"
      - name: Arşivden geri al
        if: inputs.geri_al != ''
        env:
          KID: ${{ inputs.geri_al }}
          GERI_AL_ANAHTAR: "A GRUBU"
        run: |
          pip install -q requests
          python3 yt_kuyruk.py geri_al "$KID"
      - name: Saatleri yeniden dağıt
        if: inputs.planla
        run: python3 yt_kuyruk.py planla
      - name: Planlı videolara ürün linkleri
        if: inputs.urunler
        run: python3 yt_kuyruk.py urunler
      - name: Bütün videolardan satış linklerini sil
        if: inputs.urun_kaldir
        run: python3 yt_kuyruk.py urun_kaldir
      # Esnaf başvuru kontrolü 14 Kasım 2026'da kapatıldı (20/B: esnafa reklam hizmeti verilmiyor, site formu kaldırıldı)
      - name: Günlük üretim nöbeti (geciken üretimleri başlat)
        if: inputs.kanal == '' && inputs.geri_al == ''
        run: python3 uretim_nobet.py || true
      - name: Onayları kontrol et ve yükle
        run: python3 yt_kuyruk.py kontrol
      - name: Yayındaki videolara seri yorumu
        run: python3 yt_kuyruk.py yorumlar || true
      - name: Eksik kapak resimlerini tamamla
        run: python3 yt_kuyruk.py kapaklar || true
      - name: Kuyruğu kaydet
        if: always()   # 24 Kas 2026: önceki adım çökünce "yüklendi" bilgisi kaybolup aynı video tekrar tekrar yükleniyordu
        run: |
          git config user.name "Dükkan TV Bot"
          git config user.email "dukkan.tvstudio@gmail.com"
          git add -A kuyruk tokens
          git diff --cached --quiet && exit 0
          git commit -m "Yayın kuyruğu güncellendi"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i * 4)); done

  # GitHub planlı tetiklemeleri sık atlıyor: bu iş sıradaki paylaşım saatine kadar bekler ve
  # "YouTube Yayın"ı yeniden başlatır. Böylece kesintisiz bir zincir oluşur; cron sadece yedek.
  nobet:
    needs: yayin
    if: always() && inputs.kanal == '' && inputs.geri_al == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sıradaki paylaşıma kadar bekle
        run: |
          SN=$(python3 nobet.py)
          sleep "$SN"
      - name: Yayın işini yeniden başlat
        run: gh workflow run youtube-yayin.yml --ref main -R "$GITHUB_REPOSITORY"
