name: YouTube Yayın

# Onay bekleyen videoları kontrol eder; Levent'in Telegram'da "Onayla" dediklerini
# YouTube'a 19:00'a planlı yükler. Ayrıca elle video eklemek için de kullanılır.
on:
  schedule:
    - cron: "13 6-14 * * *"    # 09:13–17:13 her saat (onaylar)
    - cron: "3,33 15 * * *"    # 18:03, 18:33
    - cron: "1,11,21,31,41,51 16-17 * * *" # 19:01–20:51 on dakikada bir (Instagram 19:00 / 19:30 / 20:00 paylaşımları gecikmesin)
    - cron: "3,33 18 * * *"    # 21:03, 21:33
  workflow_dispatch:
    inputs:
      kanal:
        description: "Elle ekleme: kanal (boş = sadece onayları kontrol et)"
        required: false
        type: choice
        default: ""
        options: ["", dukkantv, kasakurgu, dramabite]
      video_url:
        description: "Elle ekleme: videonun indirme adresi (mp4)"
        required: false
      baslik:
        description: "Elle ekleme: başlık"
        required: false
      aciklama:
        description: "Elle ekleme: açıklama"
        required: false
      planla:
        description: "Planlı videoların saatlerini aralıklı olacak şekilde yeniden dağıt"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # yeni başvurular için Başvuru Taslak / üretim işlerini başlatabilsin

concurrency:
  group: youtube-yayin

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ONAY_URL: https://dukkantv-onay.dukkan-tvstudio.workers.dev   # Cloudflare onay dinleyicisi
    steps:
      - uses: actions/checkout@v4
      - name: Elle ekle
        if: inputs.kanal != '' && inputs.video_url != ''
        env:
          KANAL: ${{ inputs.kanal }}
          URL: ${{ inputs.video_url }}
          BASLIK: ${{ inputs.baslik }}
          ACIKLAMA: ${{ inputs.aciklama }}
        run: |
          curl -fsSL "$URL" -o /tmp/elle.mp4
          python3 yt_kuyruk.py ekle "$KANAL" /tmp/elle.mp4 "$BASLIK" "$ACIKLAMA" ""
      - name: Saatleri yeniden dağıt
        if: inputs.planla
        run: python3 yt_kuyruk.py planla
      - name: Siteden gelen başvuruları kontrol et
        env:
          GH_REPO: ${{ github.repository }}
        run: python3 basvuru.py kontrol || echo "::warning::Başvuru kontrolü başarısız"
      - name: Onayları kontrol et ve yükle
        run: python3 yt_kuyruk.py kontrol
      - name: Kuyruğu kaydet
        run: |
          git config user.name "Dükkan TV Bot"
          git config user.email "dukkan.tvstudio@gmail.com"
          git add -A kuyruk tokens
          git diff --cached --quiet && exit 0
          git commit -m "Yayın kuyruğu güncellendi"
          git pull --rebase -q && git push
