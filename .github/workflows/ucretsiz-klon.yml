name: Ücretsiz Ses Klonu (Chatterbox)

permissions:
  contents: write

# Levent'in sesini ücretsiz açık kaynak modelle (Chatterbox Multilingual, MIT) klonlar; denemeyi Telegram'a yollar.
on:
  workflow_dispatch:

jobs:
  klon:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q chatterbox-tts requests
      - run: python ucretsiz_klon.py
      - name: Denemeleri kaydet
        if: always()
        run: |
          git config user.name "dukkan-tv-bot"; git config user.email "actions@users.noreply.github.com"
          rm -f sesler/deneme/_* sesler/deneme/ref.wav
          git add sesler; git diff --cached --quiet || (git commit -qm "Ücretsiz ses klonu denemesi" && (git push || (git pull --rebase origin main && git push)))
