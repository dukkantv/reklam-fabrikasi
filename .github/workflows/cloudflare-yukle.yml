name: Cloudflare Yükle

# cloudflare/ klasöründeki onay dinleyicisini Cloudflare'e yükler.
# Gerekli gizli anahtar: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" şablonuyla alınır)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloudflare/**"]

jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yükle
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN gizli anahtarı eksik"; exit 1; }
          # Kopyalarken araya boşluk/satır sonu karışmış olabilir: içinden geçerli anahtarı bul
          GECERLI=""
          # Uzunlukları yaz (içerik değil) — ne yapıştırıldığını anlamak için
          printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -s '[:space:]' '\n' | awk '{print "parça uzunluğu:", length($0)}'
          ADAYLAR=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' || true)
          for t in $ADAYLAR; do
            if curl -fsS -H "Authorization: Bearer $t" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -q '"status":"active"'; then
              GECERLI="$t"; break
            fi
          done
          test -n "$GECERLI" || { echo "Geçerli Cloudflare anahtarı bulunamadı (yeniden oluşturup ekleyin)"; exit 1; }
          export CLOUDFLARE_API_TOKEN="$GECERLI"
          echo "Cloudflare anahtarı doğrulandı ✅"
          npx --yes wrangler@4 deploy
          # Dinleyicinin gizli değeri: bot anahtarından türetilir
          printf %s "$TOKEN" | sha256sum | cut -c1-48 | npx --yes wrangler@4 secret put GIZLI
          # Yeni başvuru bildirimleri için Telegram bilgileri
          printf %s "$TOKEN" | npx --yes wrangler@4 secret put TG_TOKEN
          printf %s "$CHAT" | npx --yes wrangler@4 secret put TG_CHAT
      - name: Dene
        run: |
          sleep 5
          curl -fsS https://dukkantv-onay.dukkan-tvstudio.workers.dev/ ; echo
