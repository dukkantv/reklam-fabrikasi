name: Tekrar video kontrolü

# Kanallarda (YouTube, Instagram, Facebook) aynı videonun birden fazla yüklenip yüklenmediğini bulur.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kontrol
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python tekrar_kontrol.py
      - name: Sonucu kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add rapor/tekrar_kontrol.json
          git commit -qm "Tekrar video kontrolü" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
